services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamtopia
      POSTGRES_PASSWORD: dreamtopia_local
      POSTGRES_DB: dreamtopia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dreamtopia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamtopia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dreamtopia_data:
